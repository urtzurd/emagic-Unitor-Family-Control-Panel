<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unitor control panel</title>
    <link rel="stylesheet" href="unitor-control-panel.css">
</head>
<body>
<div class="container" id="mainContainer">

                                </g>
                            </g>
                        </g>
                    </g>
                </g>
            </svg>
            Unitor Family Control Panel
        </h1>
        <p class="subtitle">Configuration panel for Emagic Unitor8, AMT8 and MT4 MIDI interfaces</p>

        <div class="section">
            <label for="deviceSelect">MIDI Output Device</label>
            <select id="deviceSelect" disabled>
                <option value="">Initializing MIDI...</option>
            </select>
        </div>

        <div class="section">
            <label for="inputSelect">MIDI Input Device</label>
            <select id="inputSelect" disabled>
                <option value="">Initializing MIDI...</option>
            </select>
        </div>

        <div id="statusMessage" style="margin-bottom: 25px;"></div>

        <div class="section">
            <button id="scanButton" disabled><span>Scan Device</span></button>
            <button id="nextButton" style="display: none;"><span>Next</span></button>
        </div>
    </div>

    <!-- Patches Panel -->
    <div id="patchesPanel" class="panel" style="display: none;">
        <h1 style="margin-top: -20px;" id="patchesPanelHeader"></h1>
        <div class="tabs">
            <button class="tab active" data-tab="patches">Patches</button>
            <button class="tab" data-tab="computer">Computer</button>
            <button class="tab" data-tab="patch">Patch</button>
            <button class="tab" data-tab="global">Global</button>
        </div>

        <div class="tab-pane-wrapper">
            <div id="patchesTab" class="tab-content active">
                <div class="patches-container">
                    <!-- Patch List -->
                    <div class="patch-list" id="patchList">
                        <!-- Patches 1-64 will be generated here -->
                    </div>

                    <!-- Routing Matrix -->
                    <div class="routing-matrix">
                        <div id="matrixContainer">
                            <!-- Matrix will be generated based on device type -->
                        </div>

                        <!-- Action Buttons -->
                        <div class="matrix-actions">
                            <button id="copyBtn"><span>Copy</span></button>
                            <button id="pasteBtn" disabled><span>Paste</span></button>
                            <button id="resetBtn"><span>Reset</span></button>
                            <button id="sendBtn"><span>Send to Device</span></button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="computerTab" class="tab-content">
            </div>

            <div id="patchTab" class="tab-content">
            </div>

            <div id="globalTab" class="tab-content">
                <div class="section">
                    <label for="ioLedBrightness">I/O LED Brightness</label>
                    <div class="slider-container">
                        <input type="range" id="ioLedBrightness" class="brightness-slider" min="0" max="8" step="1" value="8">
                        <span class="slider-value" id="ioLedBrightnessValue">8</span>
                    </div>
                </div>

                <div class="section">
                    <label for="rsLedBrightness">RS LED Brightness</label>
                    <div class="slider-container">
                        <input type="range" id="rsLedBrightness" class="brightness-slider" min="0" max="8" step="1" value="8">
                        <span class="slider-value" id="rsLedBrightnessValue">8</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="unitor-control-panel.js"></script>
</body>
</html>
